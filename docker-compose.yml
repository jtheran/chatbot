version: "3.8"

services:
  base:
    container_name: base_nodejs
    build: .
    ports:
      - '3325:3325'
    volumes:
      - .:/base
    depends_on:
      - sqlserverdb
    command: >
      sh -c "sleep 10 && npx prisma migrate deploy && npx prisma generate && npm run start"
    networks:
      - backend

  sqlserverdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Testing24!"
    ports:
      - "1433:1433"
    restart: always
    networks:
      - backend

  mongodb:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    networks:
      - backend

  qdrantdb:
    image: qdrant/qdrant:v1.9.1
    container_name: qdrant_db
    ports:
      - "6333:6333"   # API REST
      - "6334:6334"   # API gRPC (opcional)
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - backend


networks:
  backend:
volumes:
  qdrant_data:
  
