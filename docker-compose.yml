version: "3.8"

services:
  base:
    container_name: base_nodejs
    build: .
    ports:
      - '3325:3325'
    volumes:
      - .:/base
    
  mongodb:
        image: mongo:latest
        container_name: mongo_db
        restart: unless-stopped
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
        ports:
        - "27017:27017"

  redisdb:
      image: redis:7
      container_name: redis_db
      restart: unless-stopped
      ports:
        - "6379:6379"
      volumes:
        - ./data/redis:/data