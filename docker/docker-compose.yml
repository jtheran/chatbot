version: '3.8'

services:
    mongodb:
        image: mongo:latest
        container_name: mongodb
        restart: unless-stopped
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
        ports:
        - "27017:27017"

    redis:
        image: redis:7
        container_name: redisdb
        ports:
        - "6379:6379"
        volumes:
        - ./data/redis:/data